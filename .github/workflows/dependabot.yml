name: Dependabot

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - action.yml

jobs:
  metadata:
    name: Get metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    outputs:
      is-metamask-action: ${{ steps.is-metamask-action.outputs.is-metamask-action }}
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # 3.1.0

      - name: Check if all updates are MetaMask actions
        id: is-metamask-action
        env:
          METADATA: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          RESULT=$(echo "$METADATA" | jq 'length > 0 and all(.[]; .packageEcosystem == "github_actions" and (.dependencyName | startswith("MetaMask/")))')
          echo "is-metamask-action=$RESULT" >> "$GITHUB_OUTPUT"

  merge-pull-request:
    name: Merge pull request
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.is-metamask-action == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # 3.3.0
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Approve pull request
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.token.outputs.token }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
