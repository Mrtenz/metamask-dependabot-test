name: Dependabot

on:
  pull_request:

jobs:
  metadata:
    name: Get metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    outputs:
      is-metamask-action: ${{ steps.is-metamask-action.outputs.is-metamask-action }}
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # 3.1.0

      - name: Check if all updates are MetaMask actions
        id: is-metamask-action
        env:
          METADATA: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          RESULT=$(echo "$METADATA" | jq 'length > 0 and all(.[]; .packageEcosystem == "github_actions" and (.dependencyName | startswith("MetaMask/")))')
          echo "is-metamask-action=$RESULT" >> "$GITHUB_OUTPUT"

  merge-pull-request:
    name: Merge pull request
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.is-metamask-action == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
