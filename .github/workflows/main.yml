name: Main

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: MetaMask/action-checkout-and-setup@0543b5929698c71e3ccc6ed24eac87825669b5de # 3.5.0
        with:
          is-high-risk-environment: true
          node-version: 26.x
